name: CI

# Validates every push to main and every pull request, so regressions are
# caught before release (the release workflow only runs on version tags).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Run full-flavor unit tests
        run: ./gradlew testFullDebugUnitTest

      - name: Run Android lint (full debug)
        run: ./gradlew :app:lintFullDebug

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/app/build/reports/lint-results-fullDebug.html
            app/app/build/reports/lint-results-fullDebug.sarif
          if-no-files-found: warn
